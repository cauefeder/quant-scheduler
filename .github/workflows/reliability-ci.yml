name: Scheduler reliability CI
on:
  pull_request:
    branches: [main]
  push:
    branches: ['research/scheduler-reliability-20261118']
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_scheduler_reliability.py -v
